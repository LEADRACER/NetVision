# =============================================================================
# NetVision Backend — Docker Compose
# =============================================================================
# Start:        docker compose up -d
# Stop:         docker compose down
# With metrics: docker compose --profile monitoring up -d
# Logs:         docker compose logs -f
# =============================================================================

services:

  # ── NetVision API ───────────────────────────────────────────────────────
  netvision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netvision-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent database
      - netvision_data:/app/data
      # Capture output (PCAPs, logs)
      - netvision_captures:/app/captures
      # Reports
      - netvision_reports:/app/reports
      # Logs
      - netvision_logs:/app/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_PATH=/app/data/netvision.db
      - CAPTURES_DIR=/app/captures
      - REPORTS_DIR=/app/reports
      - LOG_DIR=/app/logs
      - CORS_ORIGINS=["*"]
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - API_KEYS=${API_KEYS:-}
      - ALERT_SLACK_WEBHOOK=${ALERT_SLACK_WEBHOOK:-}
      - ALERT_DISCORD_WEBHOOK=${ALERT_DISCORD_WEBHOOK:-}
      - ALERT_TELEGRAM_WEBHOOK=${ALERT_TELEGRAM_WEBHOOK:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
    # Required for raw socket operations (nmap, scapy)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Prometheus (monitoring profile) ────────────────────────────────────
  prometheus:
    profile: ["monitoring"]
    image: prom/prometheus:latest
    container_name: netvision-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  # ── Grafana (monitoring profile) ───────────────────────────────────────
  grafana:
    profile: ["monitoring"]
    image: grafana/grafana:latest
    container_name: netvision-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=

volumes:
  netvision_data:
  netvision_captures:
  netvision_reports:
  netvision_logs:
  prometheus_data:
  grafana_data:
