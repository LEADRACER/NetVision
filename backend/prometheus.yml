# NetVision — Prometheus scrape config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "netvision"
    static_configs:
      - targets: ["netvision:8000"]
    metrics_path: "/metrics"
    # Rate limit scrape to avoid overwhelming the backend
    scrape_interval: 30s
    scrape_timeout: 10s
